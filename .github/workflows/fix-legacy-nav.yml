name: Fix legacy navigation
on:
  push:
    branches: [gaoping-site]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gaoping-site
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f in ['index.html','cpts_311_nc/index.html','ex112/index.html']:
              p=Path(f)
              s=p.read_text(errors='replace')
              s=s.replace('index.htmlindex.html','index.html')
              if f == 'index.html':
                  s=s.replace('http://v3.bootcss.com/examples/starter-template/#','index.html')
                  s=s.replace('https://v3.bootcss.com/examples/starter-template/#','index.html')
              p.write_text(s)
          PY
          rm -f .github/workflows/fix-legacy-nav.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix restored site navigation links'
          git push origin HEAD:gaoping-site
