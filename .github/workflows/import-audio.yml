name: Import original KISSr audio

on:
  push:
    branches: [gaoping-site]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kissr-audio-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original MP3 files
        shell: bash
        run: |
          if [ -f audio/14.mp3 ]; then
            echo "Audio already imported"
            exit 0
          fi
          mkdir -p audio
          awk '/mkdir -p audio/{f=1;next} /git config user.name/{f=0} f && /curl --fail --location/' .github/workflows/pages.yml | sed 's/^            //' > /tmp/get-audio.sh
          bash /tmp/get-audio.sh
          test -s audio/01.mp3
          test -s audio/14.mp3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio
          git commit -m 'Restore 14 original KISSr MP3 recordings'
          git push origin HEAD:gaoping-site
